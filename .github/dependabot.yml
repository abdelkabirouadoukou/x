# Dependabot — automated dependency updates.

version: 2
updates:
  # "bun" is the native ecosystem for bun.lock; "npm" can't parse bun.lock
  # correctly and its versioning-strategy isn't supported for Bun.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
