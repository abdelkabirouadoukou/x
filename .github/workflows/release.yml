name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: "Guard against workspace protocol in publishable manifests"
        run: |
          if grep -rn 'workspace:' packages/*/package.json; then
            echo "::error::publishable package manifests must not use the workspace: protocol (Bun publishes it literally). Use a real semver range."
            exit 1
          fi

      # changesets/action@v1 used to write ~/.npmrc itself from NPM_TOKEN;
      # v2 no longer touches npm auth, so the CLI's `npm publish` must be
      # authenticated explicitly.
      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release PR or Publish
        id: changesets
        # v1 parses `New tag:` from the CLI's stdout to detect published
        # packages, which @changesets/cli v3 no longer prints. v2 reads the
        # CHANGESETS_OUTPUT event file the CLI writes instead.
        uses: changesets/action@v2
        with:
          # changeset:version = `changeset version && bun run lint:fix`, but the
          # version PR must also refresh bun.lock so it stays in sync with the
          # bumped package.json versions (see #247). Inlining the sequence here
          # is least-fragile: changesets/action@v2 runs version-script via
          # `exec(script)` then `git add .` / GitHub API commit, so any file
          # touched by the script (including bun.lock) is captured in the
          # version commit without a follow-up step.
          version-script: changeset version && bun install && bun run lint:fix
          publish-script: bunx @changesets/cli publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Changesets/action creates one GitHub release per published package
      # from the changelog, but its generated notes credit no one. This step
      # enriches each new release with a "Contributors" section listing every
      # distinct author whose commits landed since the last release — the
      # humans who actually built the changes. Bots are noted separately and
      # excluded from the human shout-outs.
      - name: Add contributors to release notes
        if: steps.changesets.outputs.published == 'true'
        run: bun scripts/release/credit-contributors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CycloneDX SBOM of the published packages' dependency tree (Syft). The
      # release flow publishes on merge of a versioning PR; generating the SBOM
      # as a sibling job in the same workflow run is the artifact buyers can
      # consume without asking (in the Actions run page under "Artifacts").
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          path: packages
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
