name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: "Guard against workspace protocol in publishable manifests"
        run: |
          if grep -rn 'workspace:' packages/*/package.json; then
            echo "::error::publishable package manifests must not use the workspace: protocol (Bun publishes it literally). Use a real semver range."
            exit 1
          fi

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # changeset:version = `changeset version && bun run lint:fix`, so the
          # versioning PR is never blocked by biome formatting of the rewritten
          # package.json files (JSON.stringify writes multi-line arrays).
          version: bun run changeset:version
          publish: bunx @changesets/cli publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CycloneDX SBOM of the published packages' dependency tree (Syft). The
      # release flow publishes on merge of a versioning PR; generating the SBOM
      # as a sibling job in the same workflow run is the artifact buyers can
      # consume without asking (in the Actions run page under "Artifacts").
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          path: packages
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
