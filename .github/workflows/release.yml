name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: "Guard against workspace protocol in publishable manifests"
        run: |
          if grep -rn 'workspace:' packages/*/package.json; then
            echo "::error::publishable package manifests must not use the workspace: protocol (Bun publishes it literally). Use a real semver range."
            exit 1
          fi

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # changeset:version = `changeset version && bun run lint:fix`, so the
          # versioning PR is never blocked by biome formatting of the rewritten
          # package.json files (JSON.stringify writes multi-line arrays).
          version: bun run changeset:version
          publish: bunx @changesets/cli publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
