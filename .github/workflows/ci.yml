name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible builds — bump deliberately.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build:packages

      - name: Test
        run: bun test

  test-postgres:
    name: Test (Postgres migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible builds — bump deliberately.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runPostgresMigrations tests are gated on DATABASE_URL and skipped
      # otherwise (see migrate.test.ts), so only this job exercises the real
      # Postgres rollback/retry behavior via the service container above.
      - name: Test (Postgres migrations)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun test packages/core/src/data/migrate.test.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      # Guard the production-only graph separately: anything in what's actually
      # shipped must be clean with NO ignores.
      - name: Audit production dependencies
        run: bun audit --prod

  bench:
    name: Load test (non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking on purpose: load numbers vary with runner hardware, so this
    # job reports the benchmark but never gates the merge. It fails only on
    # hard regressions (500s under load, rate limiter not enforcing its limit).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run load test
        run: bun scripts/bench/load.ts --duration 3

      - name: Report load results
        if: always()
        run: |
          echo "::group::Latest benchmark"
          bun scripts/bench/load.ts --duration 1 2>&1 | tail -20
          echo "::endgroup::"
          echo "Load test artifacts: ${{ runner.os }}. See BENCHMARKS.md for methodology and baseline numbers."
