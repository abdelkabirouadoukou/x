name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible builds — bump deliberately.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build:packages

      - name: Test
        run: bun test

  test-postgres:
    name: Test (Postgres migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible builds — bump deliberately.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runPostgresMigrations tests are gated on DATABASE_URL and skipped
      # otherwise (see migrate.test.ts), so only this job exercises the real
      # Postgres rollback/retry behavior via the service container above.
      - name: Test (Postgres migrations)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun test packages/core/src/data/migrate.test.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      # Guard the production-only graph separately: anything in what's actually
      # shipped must be clean with NO ignores.
      - name: Audit production dependencies
        run: bun audit --prod

      # bun.lock integrity gate: depends on bun's own `--frozen-lockfile`
      # (which enforces lockfile <-> package.json sync on install, above), plus
      # a committed hash so an *unreviewed* hand-edit of the lockfile fails CI
      # even when it happens to stay in sync. Regenerate with `git add bun.lock`
      # then `shasum -a 256 bun.lock` and update `.github/bun-lock.sha256`.
      - name: Verify bun.lock integrity hash
        run: |
          actual="$(shasum -a 256 bun.lock | awk '{print $1}')"
          expected="$(cat .github/bun-lock.sha256)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::bun.lock changed but .github/bun-lock.sha256 was not updated. Expected $expected, got $actual. Starting Bun workspaces on a new version is fine — update the hash deliberately."
            exit 1
          fi
          echo "bun.lock hash verified: $actual"

  cve:
    name: CVE scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan dependency tree for known CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy findings to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  docker:
    name: Docker build + image CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the production image
        run: docker build -t thexjs:ci .

      - name: Scan the built image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: thexjs:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Block on CVEs that have an available fix but aren't applied; CVEs
          # with no upstream fix yet (affected/fix_deferred) don't hold the
          # pipeline forever. The Dockerfile patches base-image packages.
          ignore-unfixed: "true"

  bench:
    name: Load test (SLO-gated)
    runs-on: ubuntu-latest
    # Gates the merge: a run that violates an SLO, produces server errors, or
    # breaks the rate limiter fails the build. Thresholds live in
    # scripts/bench/slo.ts and BENCHMARKS.md; they are loose enough for shared
    # runners while still catching real (3-10x) regressions.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run load test (SLO gate)
        run: bun scripts/bench/load.ts --duration 3 --slo

      - name: Report load results
        if: always()
        run: |
          echo "::group::Latest benchmark"
          bun scripts/bench/load.ts --duration 1 2>&1 | tail -20
          echo "::endgroup::"
          echo "Load test artifacts: ${{ runner.os }}. See BENCHMARKS.md for methodology, SLOs and baseline numbers."
