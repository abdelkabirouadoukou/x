name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `changeset status` exits 1 when a publishable package (any @thexjs/*
      # under packages/) changed without a changeset in .changeset/.
      # Private packages (the examples) are skipped, so template/docs-only
      # PRs don't need a changeset.
      # Use the explicit scoped package name: `bunx changeset` resolves the
      # unrelated bare `changeset` npm package when @changesets/cli isn't
      # installed locally, which fails with "could not determine executable".
      - name: Check for a changeset
        run: bunx @changesets/cli status --since origin/main
